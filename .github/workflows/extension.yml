name: Extension checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extention
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extention/package-lock.json
      - run: npm ci
      - run: npm run check:widget-ui
      - run: npm run compile
      - run: npm test
      - run: npm run build
